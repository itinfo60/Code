name: Build QuickSum APK
on:
  push:
    branches: [quicksum-overlay-apk]
  workflow_dispatch:
  pull_request:
    paths: [QuickSumOverlay/**, .github/workflows/quicksum-apk.yml]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify permission-free manifest
        working-directory: QuickSumOverlay
        run: |
          ! grep -Eqi 'uses-permission|accessibilityservice|bind_accessibility_service|system_alert_window' app/src/main/AndroidManifest.xml
          ! grep -Rqi 'AccessibilityService' app/src/main/java
      - name: Build
        working-directory: QuickSumOverlay
        run: gradle :app:assembleDebug --no-daemon
      - name: Inspect final APK permissions
        working-directory: QuickSumOverlay
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump permissions "$APK" | tee /tmp/quicksum-permissions.txt
          ! grep -E 'uses-permission:|permission:' /tmp/quicksum-permissions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: QuickSumCalculator-safe-debug-apk
          path: QuickSumOverlay/app/build/outputs/apk/debug/app-debug.apk